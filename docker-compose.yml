# Local Postgres only. The app itself runs with `npm run dev` in backend/ and
# frontend/ (see README) — Fly builds the root Dockerfile, so a containerised
# app here would be a second, drifting runtime with nothing checking it.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=grillexa
      - POSTGRES_PASSWORD=grillexa
      - POSTGRES_DB=grillexa
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
