server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    location = /health {
        proxy_pass http://127.0.0.1:4001/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filenames are content-hashed, so a cached asset is never the wrong one.
    # =404 matters: without it the SPA fallback below returns index.html as
    # text/html for a missing chunk, and the failed dynamic import renders a
    # blank route instead of a visible network error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must revalidate every load, or a browser holding yesterday's
    # copy keeps asking for chunk hashes that no longer exist after a deploy.
    # no-cache still allows a cheap 304 via ETag; no-store would not.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A stale service worker is the classic PWA trap: the browser keeps running
    # the old one and the installed app stops picking up deploys. The manifest
    # gets the same treatment so icon and name changes actually land.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
