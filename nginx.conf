# Cache-Control is decided here rather than with add_header inside each
# location, because add_header in a location REPLACES every inherited one —
# a per-location Cache-Control would have silently dropped all the security
# headers below on exactly the files a browser attack targets.
#
# Content-hashed asset filenames can never be stale, so they're immutable.
# Everything else must revalidate: index.html names chunk hashes that stop
# existing at the next deploy, and a cached service worker is the classic PWA
# trap where the installed app quietly stops updating.
map $uri $grillexa_cache_control {
    default          "no-cache";
    ~^/assets/       "public, max-age=31536000, immutable";
}

server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        text/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    add_header Cache-Control $grillexa_cache_control always;

    # Security headers for everything Nginx serves, including the API it
    # proxies — this is the only place they are set (see app.js on why helmet
    # was removed). `always` matters — without it they are dropped on error
    # responses, which is precisely when an injected page would be rendered.
    #
    # The session is an httpOnly cookie, so an injected script cannot read it,
    # but it can still act with it on the page: script-src is 'self' with no
    # 'unsafe-inline'. That is only possible because index.html carries no
    # inline script at all — see frontend/public/boot.js and legacy.js, which
    # exist for this reason.
    #
    # style-src still allows inline, since the app sets style attributes in a
    # few places and an injected style cannot do what a script can. img-src
    # allows data: and blob: because jsPDF builds the invoice through a canvas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self): the Stores page captures a GPS fix while someone is
    # standing outside the shop, so the address and the map pin are the real
    # one. It stays denied to any embedded third-party frame — and the browser
    # still asks the user first; this header only decides whether it may ask.
    # connect-src stays 'self': the reverse geocode goes through the API rather
    # than the page, because Nominatim's usage policy wants a User-Agent that
    # identifies the app and a browser will not let script set one.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    # Fly terminates TLS and force_https redirects, so asserting HSTS is safe.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        proxy_pass http://127.0.0.1:4001/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter reads this: without it every request looks like it
        # came from Nginx and one user's failures would lock out the shop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =404 matters: without it the SPA fallback below answers a missing chunk
    # with index.html as text/html, and the failed dynamic import renders a
    # blank route instead of a visible error.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
