<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installable on Android: Chrome reads the manifest, then generates a
         real WebAPK on the device — home-screen icon, no address bar, its own
         entry in the app switcher. No store, no APK to distribute. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#14161f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Grillexa Inventory</title>
    <script>
      // Chrome fires beforeinstallprompt during page load — before React has
      // mounted and before any component can add a listener. Attaching it in a
      // useEffect misses the event entirely, and the Install button never
      // appears. Stash it here, at the earliest point there is, and let the
      // component pick it up whenever it mounts.
      window.__installPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
