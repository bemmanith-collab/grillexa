app = "grillexa"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Kept warm deliberately. Cold boot is ~26s (entrypoint.sh runs
  # `prisma migrate deploy` before nginx binds), and once the app is
  # installed to a phone home screen that delay is a blank splash screen
  # staff read as "broken". Costs ~$4.19/mo for an always-on
  # shared-cpu-1x 512MB machine.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
